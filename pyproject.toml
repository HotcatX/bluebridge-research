[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluebridge-research"
version = "0.1.0"
description = "Provider-independent evidence checks and research-note update workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["bluebridge*"]
